[workspace]
resolver = "3"
members = ["crates/capture", "crates/stream", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrelopes-code/telai"
rust-version = "1.88"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
fast_image_resize = "6"
jpeg-encoder = { version = "0.7", features = ["simd"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
wasapi = "0.27"
windows = "0.62"
windows-capture = "2"

telai-capture = { path = "crates/capture" }
telai-stream = { path = "crates/stream" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true
